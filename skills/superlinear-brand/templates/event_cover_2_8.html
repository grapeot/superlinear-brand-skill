<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Superlinear Academy event cover, 2.8:1, 2100x750. Render a copy: python <skill_dir>/scripts/render.py page my_event_cover_2_8.html --out-dir out/ [--final]
     Platforms crop the edges of wide covers and overlay buttons: everything stays inside the safe area
     (220 px left and right, 60 px top and bottom), which render.py checks. The green band is the only bleed.
     THEME PATHS: see promo_16x9.html. -->
<meta name="sa:canvas" content="2100x750">
<meta name="sa:safe" content="220,60,220,60">
<title>Event cover 2.8:1</title>
<link rel="stylesheet" href="../theme/tokens.css">
<link rel="stylesheet" href="../theme/layouts.css">
<link rel="stylesheet" href="../theme/promo.css">
<script src="../theme/typeset.js"></script>   <!-- typographic quotes, number+unit no-break -->
</head>
<body class="sa-promo f-cover">
  <img class="sa-p-logo" src="../theme/logos/primary-black-compact.svg" alt="Superlinear Academy">
  <div class="sa-p-tag">Free live session</div>                                  <!-- EDIT -->

  <div class="sa-p-text">
    <div class="sa-kicker">Live · Online · 60 min</div>                             <!-- EDIT -->
    <h1 class="sa-display sa-p-title" data-max-lines="2"><span class="sa-placeholder">Shipping small models</span></h1>  <!-- EDIT: at most 2 lines; drop the span -->
    <p class="sa-p-sub" data-max-lines="1">Distil a one-billion-parameter model that runs on your phone</p>  <!-- EDIT: 1 line -->
    <div class="sa-p-when">
      <div class="primary"><span class="sa-placeholder">Wednesday, Month DD · 11:00 AM PT / 2:00 PM ET</span></div>   <!-- EDIT -->
      <div class="secondary">Recording available to registered members</div>     <!-- EDIT or delete -->
    </div>
  </div>

  <figure class="sa-p-photo">
    <div class="sa-frame"><img class="sa-uncropped sa-placeholder" src="../theme/placeholders/headshot.svg" alt="Speaker">   <!-- EDIT: the real photo; drop sa-placeholder --></div>
    <figcaption><span class="sa-placeholder">Speaker Name · Role</span></figcaption>   <!-- EDIT: name; drop the sa-placeholder span -->
  </figure>

  <div class="sa-p-band" data-bleed></div>
</body>
</html>
